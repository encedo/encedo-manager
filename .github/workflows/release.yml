# Builds the Manager, packs it the way the module takes it (webroot/ with .gz
# twins, the manifest, the tar) and signs it, then puts webroot.tar on the
# release beside the source archives GitHub attaches itself.
# On a release it also writes latest.json (pack.mjs latest): what a Manager
# reads to offer "Update available" - the tag must name app/version.js.
# Then (job pages, also on a manual run) it rebuilds the GitHub Pages site
# from every release: latest.json and webroot.tar where a browser may fetch
# them cross-origin, which GitHub's release downloads do not allow.
#
# Signing: Ed25519 over SHA-512(tar || public key), with the 96-byte trailer
# public key || signature appended - what the firmware checks before it
# installs. The seed comes from the repository secret UI_SIGNING_KEY (32 bytes
# as hex); the repository variable UI_PUBLISHER_KEY (hex) is the public key it
# must give, so a wrong secret stops the run here and not on a module.
# docs/PACKAGING.md has the details.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  webroot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The SDK is a submodule of its own repository (public; checkout
          # turns its git@github.com: URL into https).
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test
        run: npm test

      - name: Pack
        run: node pack.mjs --out release | tee pack.log

      - name: Sign
        env:
          UI_SIGNING_KEY: ${{ secrets.UI_SIGNING_KEY }}
          UI_PUBLISHER_KEY: ${{ vars.UI_PUBLISHER_KEY }}
        run: |
          test -n "$UI_PUBLISHER_KEY" || { echo "set the repository variable UI_PUBLISHER_KEY (the public key, hex)"; exit 1; }
          node pack.mjs sign release/webroot_src.tar --key-env UI_SIGNING_KEY --expect "$UI_PUBLISHER_KEY" | tee sign.log

      - name: latest.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node pack.mjs latest release/webroot.tar --tag "$TAG" | tee latest.log
        shell: bash   # -eo pipefail: a refused tag fails the run, not only tee

      - name: Say what was built
        run: |
          {
            echo '## Manager release'
            echo
            echo '```'
            sed -n '/^packed/,$p' pack.log
            echo
            cat sign.log
            test -f latest.log && { echo; cat latest.log; }
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            release/webroot.tar \
            release/latest.json \
            release/webroot_src.tar \
            release/webroot_src.tar.sha256 \
            --clobber

      - name: Keep it for a manual run
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: webroot
          path: release/
          retention-days: 30

  pages:
    # Every release's latest.json and webroot.tar on GitHub Pages, where a
    # Manager may fetch them (release downloads send no CORS header, Pages
    # sends *). The releases are the only source: the whole site is rebuilt
    # from them each run, so a release edited or deleted shows on the next
    # one. pack.mjs site checks every tar against its latest.json and its
    # signature first. Settings > Pages > Source: GitHub Actions.
    needs: webroot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7      # pack.mjs only: no submodules

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - id: pages
        uses: actions/configure-pages@v6

      - name: Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName,isLatest > releases.json
          for tag in $(jq -r '.[].tagName' releases.json); do
            # only the releases made since latest.json exists (2.0.0 on)
            has=$(gh release view "$tag" --json assets --jq 'any(.assets[]; .name == "latest.json")')
            [ "$has" = true ] || continue
            gh release download "$tag" -p latest.json -p webroot.tar -D "releases/$tag"
            gh release view "$tag" --json tagName,name,body,url,publishedAt > "releases/$tag/release.json"
          done
          echo "LATEST=$(jq -r '.[] | select(.isLatest) | .tagName' releases.json)" >> "$GITHUB_ENV"

      - name: Site
        shell: bash   # -eo pipefail: a refused release fails the run, not only tee
        run: |
          node pack.mjs site releases --base "${{ steps.pages.outputs.base_url }}" \
            --latest "$LATEST" --out site | tee site.log
          { echo '## Pages'; echo; echo '```'; cat site.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
